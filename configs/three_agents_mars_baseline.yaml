  optimizer_mode: line_svgd
  iterations: 500
  snapshot_iters: [0, 100, 500]
  flow_step_size: 0.006
  traj_smooth_lambda: 0.30
  fix_line_endpoints: false
  line_anchor_lambda: 0.0
