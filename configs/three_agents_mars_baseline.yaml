seed: 42
workspace:
  xlim: [0.0, 1.0]
  ylim: [0.0, 1.0]
  resolution: 180
scenario:
  name: mars_auto
  hotspots: []
  obstacles: []
mars:
  dem_path: Mars_MGS_MOLA_DEM_mosaic_global_463m.tif
  crop_size: 720
  slope_percentile: 88.0
  obstacle_dilation: 1
sim:
  dt: 0.05
  horizon: 90
  max_accel: 3.0
agents:
  num_agents: 3
  initial_states:
    - [0.08, 0.62, 0.0, 0.0]
    - [0.08, 0.50, 0.0, 0.0]
    - [0.08, 0.38, 0.0, 0.0]
  goal_positions:
    - [0.92, 0.62]
    - [0.92, 0.50]
    - [0.92, 0.38]
stein:
  use_coupling: false
  use_obstacle_mask: true
  baseline_use_obstacle_mask: true
  strict_paper: true
  alpha: 0.02
  self_bandwidth: 0.008
  coupling_bandwidth: 0.004
  gamma: 0.0
  task_weight: 1.0
  self_repulsion_weight: 1.0
