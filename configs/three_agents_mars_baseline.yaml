  projection_margin_ratio: 0.85
  flow_smooth_passes: 0
  max_segment_length: 0.0
  segment_repair_passes: 0
  post_smooth_iters: 0
  post_smooth_lambda: 0.0
  kp: 7.5
  kv: 2.8
  control_blend: 0.7
  smooth_alpha: 0.45
  init_line_kp: 6.0
  init_line_kv: 2.2
metrics:
  fourier_K: 10
  overlap_sigma: 0.045
